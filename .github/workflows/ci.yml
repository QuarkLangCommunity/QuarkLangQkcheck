name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: QuarkLangCommunity/QuarkLangQkc
          path: QuarkLang
      - name: 让 replace ../QuarkLang 生效
        shell: bash
        run: ln -sfn "$PWD/QuarkLang" ../QuarkLang
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: go build ./...
